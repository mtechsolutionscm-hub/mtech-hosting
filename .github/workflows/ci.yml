name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mtech_hosting
          POSTGRES_USER: mtech
          POSTGRES_PASSWORD: mtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mtech -d mtech_hosting"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://mtech:mtech@localhost:5432/mtech_hosting?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npm run build
