name: CI

on:
  push:
    branches: [main, phase-1-control-plane]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mtech:mtech@localhost:5432/mtech_hosting?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Next build
        run: npm run build
