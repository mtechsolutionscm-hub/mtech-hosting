name: MTECH Hosting CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mtech_hosting
          POSTGRES_USER: mtech
          POSTGRES_PASSWORD: mtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtech -d mtech_hosting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mtech:mtech@localhost:5432/mtech_hosting?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync test database
        run: npx prisma db push

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
